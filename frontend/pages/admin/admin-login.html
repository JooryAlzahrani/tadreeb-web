<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Tadreeb</title>

  
  <link rel="stylesheet" href="../../assets/css/global.css" />
</head>

<body class="admin admin-login">
  <main class="admin-auth">
    <div class="login-container">
      <h1>Admin Login</h1>
      <p>Please enter your admin credentials</p>

      <form onsubmit="return validateLogin(event)">
        <label class="sr-only" for="username">Username</label>
        <input type="text" id="username" placeholder="Username" required />

        <label class="sr-only" for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required />

        <p class="error-message" id="errorMsg">Invalid credentials. Please try again.</p>

        <button type="submit">Login</button>
      </form>

      <p class="admin-hint">Demo login: <strong>admin</strong> / <strong>admin123</strong></p>
      <a class="admin-backlink" href="../homepage.html">← Back to website</a>
    </div>
  </main>

  <script>
    function validateLogin(event) {
      event.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === "admin" && pass === "admin123") {
        window.location.href = "admin-dashboard.html";
      } else {
        document.getElementById("errorMsg").style.display = "block";
      }
    }
  </script>
</body>
</html>
