<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tadreeb | Login</title>

  <link rel="stylesheet" href="loginandregister.css" />
  <script src="loginandregister.js" defer></script>
</head>

<body class="auth-page">

  <div class="floating-ui-bar">
    <div class="auth-logo">
      <a href="homepage.html">
        <img src="images/logo_tadreeb.png" alt="Tadreeb Logo">
      </a>
    </div>

    <div class="header-toggles">
      <div id="dark-mode-toggle" class="mode-toggle-container" data-mode="light"></div>
      <div id="language-toggle" class="lang-toggle-container" data-lang="en"></div>
    </div>
  </div>

  <div class="auth-container">
    <div class="auth-mascot">
      <img src="images/mascot_auth.png" alt="Tadreeb Login Mascot">
    </div>

    <h2 data-translate-key="login-h2">Login</h2>

    <form action="#" method="post">
      <input type="email" name="email" data-translate-key="ph-email-auth" placeholder="Enter your email" required>

      <div class="password-wrapper">
        <input type="password" name="password" data-translate-key="ph-password-auth" placeholder="Password" required>
        <span class="password-toggle" data-state="show" onclick="togglePassword(this)" data-translate-key="btn-show">Show</span>
      </div>

      <button type="submit" data-translate-key="btn-login">Login</button>
    </form>

    <p>
      <span data-translate-key="link-no-account">Don’t have an account?</span>
      <a href="register.html" data-translate-key="link-register">Register</a>
    </p>
  </div>

</body>
</html>
