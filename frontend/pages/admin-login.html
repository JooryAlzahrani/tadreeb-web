<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Tadreeb</title>
  <link rel="stylesheet" href="Tadreeb.Css" />
</head>

<body>
 <header>
  <nav>
    <div class="logo">
      <a href="homepage.html">
        <img src="logo_tadreeb.png" alt="Tadreeb Logo" style="height:50px;width:auto;">
      </a>
    </div>

    <ul class="nav-links">
      <li>
        <a href="homepage.html" data-translate-key="nav-home">Home</a>
      </li>

      <li>
        <a href="internships.html" data-translate-key="nav-internships">Internships</a>
      </li>

      <li>
        <a href="who-we-are.html" data-translate-key="nav-about">Who We Are</a>
      </li>

      <li>
        <a href="contact-us.html" data-translate-key="nav-contact">Contact Us</a>
      </li>

      <li>
        <a href="login.html" data-translate-key="nav-login">Login</a>
      </li>

      <li>
        <a href="register.html" data-translate-key="nav-register">Register</a>
      </li>

      <!-- Admin -->
      <li>
        <a href="admin-login.html" class="admin-link">
          <span class="admin-icon">👤</span>
          <span data-translate-key="nav-admin">Admin</span>
        </a>
      </li>

      <!-- Dark mode -->
      <li>
        <div id="dark-mode-toggle" class="mode-toggle-container" data-mode="light">
          <span class="toggle-track">
            <span class="toggle-slider"></span>
          </span>
          <span class="mode-text" data-translate-key="mode-text">Dark Mode</span>
        </div>
      </li>

      <!-- Language -->
      <li>
        <div id="language-toggle" class="lang-toggle-container" data-lang="en">
          <span class="lang-text" data-translate-key="lang-en">English</span>
          <span class="toggle-track">
            <span class="toggle-slider"></span>
          </span>
          <span class="lang-text" data-translate-key="lang-ar">عربي</span>
        </div>
      </li>
    </ul>
  </nav>
</header>


  <main class="admin-auth-page">
    <section class="admin-auth-card" aria-label="Admin login">
      <div class="admin-badge" aria-hidden="true">
        <span class="admin-badge-icon">🛡️</span>
        <span class="admin-badge-text">ADMIN</span>
      </div>

      <h1 class="admin-title" data-translate-key="admin-login-title">Admin Login</h1>
      <p class="admin-subtitle" data-translate-key="admin-login-subtitle">
        Sign in to access the admin dashboard.
      </p>

      <form id="adminLoginForm" class="admin-auth-form">
        <label class="admin-label" for="adminEmail" data-translate-key="admin-email-label">Email</label>
        <input
          type="email"
          id="adminEmail"
          class="admin-input"
          data-translate-key="admin-email"
          placeholder="Admin Email"
          autocomplete="username"
          required
        />

        <label class="admin-label" for="adminPassword" data-translate-key="admin-password-label">Password</label>

        <div class="admin-password-row">
          <input
            type="password"
            id="adminPassword"
            class="admin-input"
            data-translate-key="admin-password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="admin-show-btn"
            onclick="togglePassword(this)"
            data-state="show"
            data-translate-key="btn-show"
          >
            Show
          </button>
        </div>

        <p id="adminLoginError" class="admin-form-error" aria-live="polite"></p>

        <button type="submit" class="admin-login-btn" data-translate-key="admin-login-btn">
          Login
        </button>

        <p class="admin-note">
          <span data-translate-key="admin-note-1">Restricted area.</span>
          <span data-translate-key="admin-note-2">Only authorized admins can continue.</span>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2025 Tadreeb Platform. All rights reserved.</p>
    </div>
  </footer>
<script>
  document.getElementById("adminLoginForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value.trim();
    const errorMsg = document.getElementById("adminLoginError");

    
    const DEMO_EMAIL = "admin@tadreeb.com";
    const DEMO_PASSWORD = "admin123";

    if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
      
      window.location.href = "admin-dashboard.html";
    } else {
      errorMsg.textContent = "Invalid admin email or password.";
      errorMsg.style.display = "block";
    }
  });
</script>

  <script src="Tadreeb.js"></script>
</body>
</html>
